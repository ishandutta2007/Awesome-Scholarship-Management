<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Animated Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#ec4899;#8b5cf6;#3b82f6;#6366f1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#3b82f6;#ec4899;#6366f1;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#6366f1;#3b82f6;#ec4899;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Border Glow Animation -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8">
        <animate attributeName="stop-opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4">
        <animate attributeName="stop-opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8">
        <animate attributeName="stop-opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 38px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 400; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #e0e7ff; }
    .footer-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #64748b; }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-4px); } 100% { transform: translateY(0px); } }
    .floating-chip { animation: float 3s ease-in-out infinite; }
  </style>

  <!-- Card Background -->
  <rect x="15" y="15" width="970" height="290" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Background decorative grid / ambient light -->
  <circle cx="200" cy="80" r="140" fill="#6366f1" opacity="0.08" filter="url(#glow)">
    <animate attributeName="r" values="120;160;120" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="800" cy="220" r="140" fill="#a855f7" opacity="0.08" filter="url(#glow)">
    <animate attributeName="r" values="140;110;140" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Header Icon & Title -->
  <g transform="translate(50, 50)">
    <!-- Animated Icon -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#accentGrad)" filter="url(#glow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite" />
    </rect>
    <text x="28" y="38" font-size="28" text-anchor="middle" fill="#ffffff">🎓</text>

    <!-- Main Title -->
    <text x="75" y="40" class="title">Awesome Scholarship Management</text>
  </g>

  <!-- Subtitle -->
  <text x="50" y="145" class="subtitle">Curated directory of enterprise SaaS solutions, open-source review pipelines &amp; scholarship lifecycle tools</text>

  <!-- Badge Pills -->
  <g transform="translate(50, 185)">
    <!-- Pill 1 -->
    <g class="floating-chip" style="animation-delay: 0s;">
      <rect x="0" y="0" width="195" height="38" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" filter="url(#pillShadow)" />
      <text x="97" y="24" text-anchor="middle" class="badge-text">🏢 SaaS &amp; Commercial</text>
    </g>

    <!-- Pill 2 -->
    <g class="floating-chip" style="animation-delay: 0.5s;" transform="translate(210, 0)">
      <rect x="0" y="0" width="205" height="38" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" filter="url(#pillShadow)" />
      <text x="102" y="24" text-anchor="middle" class="badge-text">⚡ Open-Source Systems</text>
    </g>

    <!-- Pill 3 -->
    <g class="floating-chip" style="animation-delay: 1.0s;" transform="translate(430, 0)">
      <rect x="0" y="0" width="210" height="38" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" filter="url(#pillShadow)" />
      <text x="105" y="24" text-anchor="middle" class="badge-text">📊 Scoring &amp; Review Logic</text>
    </g>

    <!-- Pill 4 -->
    <g class="floating-chip" style="animation-delay: 1.5s;" transform="translate(655, 0)">
      <rect x="0" y="0" width="245" height="38" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" filter="url(#pillShadow)" />
      <text x="122" y="24" text-anchor="middle" class="badge-text">🏆 Award Lifecycle &amp; Donors</text>
    </g>
  </g>

  <!-- Footer meta bar inside banner -->
  <g transform="translate(50, 265)">
    <circle cx="6" cy="6" r="4" fill="#22c55e" />
    <text x="20" y="10" class="footer-text">Transparent Pricing • Active Community Maintenance • Verified Open-Source Star Counts</text>
  </g>
</svg>
