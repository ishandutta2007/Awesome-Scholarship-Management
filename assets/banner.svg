<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"><animate attributeName="stop-color" dur="8s" repeatCount="indefinite" values="#6366f1;#ec4899;#8b5cf6;#3b82f6;#6366f1"/></stop><stop offset="50%" stop-color="#a855f7"><animate attributeName="stop-color" dur="8s" repeatCount="indefinite" values="#a855f7;#3b82f6;#ec4899;#6366f1;#a855f7"/></stop><stop offset="100%" stop-color="#38bdf8"><animate attributeName="stop-color" dur="8s" repeatCount="indefinite" values="#38bdf8;#6366f1;#3b82f6;#ec4899;#38bdf8"/></stop></linearGradient><linearGradient id="borderGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".8"><animate attributeName="stop-opacity" dur="4s" repeatCount="indefinite" values="0.8;0.3;0.8"/></stop><stop offset="50%" stop-color="#a855f7" stop-opacity=".4"><animate attributeName="stop-opacity" dur="4s" repeatCount="indefinite" values="0.4;0.9;0.4"/></stop><stop offset="100%" stop-color="#38bdf8" stop-opacity=".8"><animate attributeName="stop-opacity" dur="4s" repeatCount="indefinite" values="0.8;0.3;0.8"/></stop></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="10"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="pillShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".4" stdDeviation="4"/></filter></defs><style>@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}.badge-text,.footer-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-size:38px;font-weight:800;fill:#fff;letter-spacing:-.5px}.subtitle{font-size:16px;font-weight:400;fill:#94a3b8}.badge-text{font-size:13px;font-weight:600;fill:#e0e7ff}.footer-text{font-size:12px;font-weight:500;fill:#64748b}.floating-chip{animation:float 3s ease-in-out infinite}</style><rect width="970" height="290" x="15" y="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" rx="20"/><circle cx="200" cy="80" r="140" fill="#6366f1" filter="url(#glow)" opacity=".08"><animate attributeName="r" dur="6s" repeatCount="indefinite" values="120;160;120"/></circle><circle cx="800" cy="220" r="140" fill="#a855f7" filter="url(#glow)" opacity=".08"><animate attributeName="r" dur="5s" repeatCount="indefinite" values="140;110;140"/></circle><g transform="translate(50, 50)"><rect width="56" height="56" x="0" y="0" fill="url(#accentGrad)" filter="url(#glow)" rx="14"><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0.85;1;0.85"/></rect><text x="28" y="38" fill="#fff" font-size="28" text-anchor="middle">🎓</text><text x="75" y="40" class="title">Awesome Scholarship Management</text></g><text x="50" y="145" class="subtitle">Curated directory of enterprise SaaS solutions, open-source review pipelines &amp; scholarship lifecycle tools</text><g><g class="floating-chip" style="animation-delay:0s" transform="translate(50, 185)"><rect width="195" height="38" x="0" y="0" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" filter="url(#pillShadow)" rx="10"/><text x="97" y="24" class="badge-text" text-anchor="middle">🏢 SaaS &amp; Commercial</text></g><g class="floating-chip" style="animation-delay:.5s" transform="translate(50, 185) translate(210, 0)"><rect width="205" height="38" x="0" y="0" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" filter="url(#pillShadow)" rx="10"/><text x="102" y="24" class="badge-text" text-anchor="middle">⚡ Open-Source Systems</text></g><g class="floating-chip" style="animation-delay:1s" transform="translate(50, 185) translate(430, 0)"><rect width="210" height="38" x="0" y="0" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" filter="url(#pillShadow)" rx="10"/><text x="105" y="24" class="badge-text" text-anchor="middle">📊 Scoring &amp; Review Logic</text></g><g class="floating-chip" style="animation-delay:1.5s" transform="translate(50, 185) translate(655, 0)"><rect width="245" height="38" x="0" y="0" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" filter="url(#pillShadow)" rx="10"/><text x="122" y="24" class="badge-text" text-anchor="middle">🏆 Award Lifecycle &amp; Donors</text></g></g><g transform="translate(50, 265)"><circle cx="6" cy="6" r="4" fill="#22c55e"/><text x="20" y="10" class="footer-text">Transparent Pricing • Active Community Maintenance • Verified Open-Source Star Counts</text></g></svg>